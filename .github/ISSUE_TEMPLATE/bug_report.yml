name: Bug Report
description: Report a bug in LNCrawler
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        > [!NOTE]
        > If the issue is specific to a particular novel source or crawler,
        > please report it in [LNCrawlerSources](https://github.com/Binit06/LNCrawlerSources) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clearly describe the problem you encountered.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the steps required to reproduce the issue.
      placeholder: |
        1. Open...
        2. Select...
        3. Press...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LNCrawler version
      placeholder: "v1.0.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant logs or stack traces.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Anything else that may help diagnose the issue.